
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一步一走 - 泽禹的失忆之旅</title>
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --bg-color: #1a1a1a;
            --card-bg: #2c2c2c;
            --text-color: #e0e0e0;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 模拟手机屏幕 */
        #app {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 开场封面动画 */
        #cover-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000 url('无标题1230_20261004194548.png') center/contain no-repeat;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }
        #cover-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #cover-screen h1 {
            font-size: 2.5rem;
            color: #fff;
            letter-spacing: 5px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1.5s forwards 0.5s;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.8);
        }
        #cover-screen p {
            margin-top: 10px;
            color: var(--primary-green);
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeInUp 1.5s forwards 1.2s;
        }
        #cover-screen .cover-hint {
            position: absolute;
            bottom: 46px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.85);
            letter-spacing: 4px;
            font-size: 0.85rem;
            animation: hintBlink 1.8s infinite;
        }
        @keyframes hintBlink { 0%,100% { opacity: .3; } 50% { opacity: .9; } }

        /* 故事内通用图片（手机自适应） */
        .story-img {
            width: 100%;
            display: block;
            border-radius: 10px;
            margin: 12px 0;
            box-shadow: 0 4px 14px rgba(0,0,0,0.45);
        }

        /* BGM 开关按钮 */
        #music-toggle {
            position: absolute;
            top: 11px;
            right: 12px;
            z-index: 35;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--dark-green);
            background: rgba(26,26,26,0.85);
            color: var(--primary-green);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #music-toggle.playing { box-shadow: 0 0 10px rgba(46,204,113,0.7); }

        /* ===== 真实手机弹窗（微信对话列表样式） ===== */
        .phone-mock {
            width: 100%;
            max-width: 330px;
            margin: 14px auto;
            background: #111;
            border-radius: 34px;
            padding: 12px 10px;
            box-shadow: 0 8px 22px rgba(0,0,0,0.55);
        }
        .phone-screen {
            position: relative;
            height: 500px;
            border-radius: 24px;
            overflow: hidden;
            background: #ededed;
        }
        .phone-status {
            display: flex;
            justify-content: space-between;
            padding: 6px 20px;
            font-size: 12px;
            background: #f7f7f7;
        }
        .pm-page {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            top: 28px; /* 让出顶部时间状态栏 */
            display: flex;
            flex-direction: column;
        }
        .pm-home-page {
            z-index: 1;
            background: linear-gradient(160deg, #3a5a4a, #1c2b23);
        }
        .pm-apps {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding-top: 70px;
        }
        .pm-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #fff;
            cursor: pointer;
        }
        .pm-app:active { transform: scale(0.92); }
        .pm-app-icon {
            width: 58px;
            height: 58px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .pm-sub-page {
            z-index: 2;
            transform: translateX(100%);
            transition: transform 0.25s ease;
            background: #ededed;
        }
        .pm-sub-page.show { transform: translateX(0); }
        .pm-app-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            font-weight: 600;
            background: #f7f7f7;
            border-bottom: 1px solid #e2e2e2;
        }
        .pm-back {
            font-size: 28px;
            line-height: 0.9;
            cursor: pointer;
            padding: 2px 4px;
        }
        .pm-sys-note {
            text-align: center;
            font-size: 11px;
            color: #999;
            padding: 7px 10px;
        }
        .pm-chat-list { flex: 1; overflow-y: auto; background: #fff; }
        .pm-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .pm-row:active { background: #e9e9e9; }
        .pm-avatar {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .pm-row-text { flex: 1; min-width: 0; }
        .pm-name { font-size: 15px; color: #111; }
        .pm-preview {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .pm-bubbles {
            flex: 1;
            overflow-y: auto;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pm-b {
            max-width: 78%;
            padding: 8px 11px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.55;
            word-wrap: break-word;
        }
        .pm-b.l { background: #fff; align-self: flex-start; }
        .pm-b.r { background: #95ec69; align-self: flex-end; }

        /* 顶部状态栏 (模拟左上角实时显示地点) */
        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 52px 15px 20px;
            font-size: 0.9rem;
            color: var(--primary-green);
            border-bottom: 1px solid #333;
            background: rgba(26, 26, 26, 0.9);
            z-index: 10;
        }
        #status-bar .location {
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        #status-bar .location::before {
            content: '📍';
            margin-right: 5px;
            font-size: 0.8rem;
        }
        #status-bar .progress {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* 任务栏（从旁边弹出的文字框） */
        #task-bar {
            position: absolute;
            top: 62px;
            left: 0;
            z-index: 15;
            max-width: 78%;
            background-color: rgba(20, 30, 24, 0.95);
            border: 1px solid var(--primary-green);
            border-left: none;
            box-shadow: 0 0 8px rgba(46,204,113,0.25), inset 0 0 12px rgba(46,204,113,0.08);
            padding: 10px 15px;
            font-size: 0.85rem;
            border-radius: 0 8px 8px 0;
            transform: translateX(-105%);
            transition: transform 0.35s ease;
        }
        #task-bar.active {
            transform: translateX(0);
        }

        /* 内容滚动区 */
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px;
            line-height: 1.6;
            font-size: 1rem;
            scroll-behavior: smooth;
        }
        #content p {
            margin-bottom: 15px;
            text-indent: 2em;
        }

        /* 选项/按钮区域 */
        #choices {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(to top, rgba(26,26,26,1) 70%, rgba(26,26,26,0));
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }
        .choice-btn {
            background-color: var(--card-bg);
            color: var(--primary-green);
            border: 1px solid var(--dark-green);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        .choice-btn:hover {
            background-color: var(--primary-green);
            color: #fff;
        }
        .choice-btn:active {
            transform: scale(0.98);
        }
        .choice-btn.locked {
            opacity: 0.5;
            pointer-events: none;
            border-color: #555;
            color: #555;
        }

        /* 线索栏 (侧面) */
        #clue-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--primary-green);
            color: #fff;
            writing-mode: vertical-rl;
            padding: 15px 5px;
            border-radius: 5px 0 0 5px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 30;
            box-shadow: -2px 0 5px rgba(0,0,0,0.3);
        }
        
        /* 线索弹窗 */
        #clue-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
        }
        #clue-modal.active {
            display: flex;
        }
        .clue-content {
            background: var(--card-bg);
            width: 100%;
            height: 70%;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .clue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .clue-header h3 {
            color: var(--primary-green);
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .clue-item {
            background: #383838;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            border-left: 3px solid var(--primary-green);
        }

        /* 特殊元素样式 */
        .image-placeholder {
            width: 100%;
            height: 150px;
            background-color: #444;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #aaa;
            margin: 10px 0;
            font-size: 0.8rem;
            background-size: cover;
            background-position: center;
        }
        
        .phone-chat {
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
        }
        .chat-msg {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .chat-msg.left {
            background: #333;
            align-self: flex-start;
        }
        .chat-msg.right {
            background: var(--dark-green);
            align-self: flex-end;
            margin-left: auto;
        }
        .chat-msg.sys {
            text-align: center;
            background: none;
            color: #888;
            font-size: 0.75rem;
            max-width: 100%;
        }

        /* 可播放的视频框 */
        .video-box video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            display: block;
            box-shadow: 0 4px 14px rgba(0,0,0,0.45);
        }
        .video-tip {
            text-indent: 0;
            font-size: 0.75rem;
            color: #e0a060;
            text-align: center;
            margin-top: 6px;
        }

        /* 可点击的录音文件条目 */
        .audio-file {
            background: #333;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .audio-file:active { background: #444; transform: scale(0.99); }

        /* 物品展示区：内容多时可上下滑动 */
        #item-view {
            max-height: 58vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        /* 小象肚子里藏着的纸条（先露出一角，点击抽出） */
        .elephant-note {
            overflow: hidden;
            max-height: 30px; /* 默认露出纸条一角 */
            opacity: 1;
            transition: max-height 0.5s ease;
            background: #fffdf2;
            border: 1px dashed #c9b978;
            border-radius: 6px;
            margin: 10px 0;
            cursor: pointer;
            position: relative;
        }
        .elephant-note::after {
            content: '▲ 点我抽出纸条';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 2px;
            text-align: center;
            font-size: 0.65rem;
            color: #b09a55;
        }
        .elephant-note.show {
            max-height: 220px;
        }
        .elephant-note.show::after { content: none; }
        .elephant-note p {
            padding: 14px;
            margin: 0;
            text-indent: 0;
        }
        #elephant-img { cursor: pointer; }

        /* ===== 笔记本电脑（密码解锁） ===== */
        .laptop {
            width: 100%;
            max-width: 360px;
            margin: 14px auto;
        }
        .laptop-screen {
            height: 230px;
            background: #000;
            border: 8px solid #222;
            border-bottom-width: 12px;
            border-radius: 10px 10px 0 0;
            overflow: hidden;
            position: relative;
        }
        .laptop-base {
            height: 12px;
            background: linear-gradient(#3a3a3a, #222);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.5);
        }
        .lock-page {
            height: 100%;
            background: linear-gradient(160deg, #2b4a6f, #16222e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
        }
        .lock-time { font-size: 2rem; font-weight: 300; letter-spacing: 2px; }
        .lock-date { font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
        .lock-input {
            width: 130px;
            padding: 6px 10px;
            border-radius: 20px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 6px;
            background: rgba(255,255,255,0.25);
            color: #fff;
        }
        .lock-input::placeholder { color: rgba(255,255,255,0.6); letter-spacing: 0; font-size: 0.75rem; }
        .lock-btn {
            padding: 5px 22px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.9);
            color: #16222e;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .lock-btn:active { transform: scale(0.95); }
        .lock-msg { font-size: 0.7rem; color: #ffb3b3; height: 14px; }
        .shake { animation: lockShake 0.4s; }
        @keyframes lockShake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .desktop-page {
            height: 100%;
            background: linear-gradient(160deg, #3a5a4a, #1c2b23);
            display: flex;
            flex-direction: column;
        }
        .desktop-icons {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 18px;
            align-content: start;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            color: #fff;
        }
        .di-img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .desktop-bar {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            font-size: 0.65rem;
            color: #fff;
            background: rgba(0,0,0,0.45);
        }

    </style>
</head>
<body>

<div id="app">
    <!-- 开场封面 -->
    <div id="cover-screen">
        <div class="cover-hint">点 按 屏 幕 进 入</div>
    </div>

    <!-- 顶部状态栏 (地点+进度) -->
    <div id="status-bar">
        <div class="location" id="location-display">未知</div>
        <div class="progress" id="progress-display">1 / 7</div>
    </div>

    <!-- 任务栏 -->
    <div id="task-bar"></div>

    <!-- 剧情内容区 -->
    <div id="content"></div>

    <!-- 选项按钮区 -->
    <div id="choices"></div>

    <button id="music-toggle" title="背景音乐">🎵</button>

    <!-- 线索栏按钮 -->
    <div id="clue-btn">🔍 线索栏</div>

    <!-- 线索弹窗 -->
    <div id="clue-modal">
        <div class="clue-content">
            <div class="clue-header">
                <h3>已收集线索</h3>
                <button class="close-btn" onclick="toggleClues()">×</button>
            </div>
            <div id="clue-list"></div>
        </div>
    </div>
</div>

<audio id="bgm" src="歌曲.mp3" loop preload="auto"></audio>

<script>
    // --- 游戏状态 ---
    const state = {
        currentStep: 0,
        location: "未知",
        clues: [],
        // 记录第一步中打开了哪些物品
        step1_opened: { record: false, elephant: false, photo: false, phone: false, cup: false },
        // 记录第二步
        step2_opened: false,
        // 记录第三步
        step3_opened: false
    };

    // 游戏剧本数据
    const script = [
        {
            id: 0,
            location: "北京医院·病房",
            task: "任务1：寻找线索（床头病历、小象、照片、手机）",
            text: `
                <p>我醒了，可我，不知道我是谁。</p>
                <p>（旁边弹出任务栏）任务1：寻找线索</p>
            `,
            choices: [
                { text: "1. 床头的病历", action: () => openItem(0, 'record') },
                { text: "2. 床头的小象", action: () => openItem(0, 'elephant') },
                { text: "3. 床头的照片", action: () => openItem(0, 'photo') },
                { text: "4. 身边充着电的手机", action: () => openItem(0, 'phone') },
                { text: "5. 去厕所", action: () => renderToilet() },
                { text: "6. 继续剧情", action: () => nextStep(1), condition: () => state.step1_opened.record && state.step1_opened.elephant && state.step1_opened.photo && state.step1_opened.phone }
            ]
        },
        {
            id: 1,
            location: "北京医院·病房",
            task: "任务：等待医生检查",
            text: `
                <p>进来一个男人，他发现你醒了，看出你眼里的陌生，自我介绍到：</p>
                <p>“我是土豆哥，你的助理，我喊医生来。”</p>
                <p>医生来了之后，帮你做了检查，确认你是失忆了，说多看点之前有关的物件没准会好起来，会想起来一些，说后面检查一下就可以出院了。</p>
                <p>自称土豆哥的人似乎很关心你，给你忙前忙后，办出院手续什么的，让你带上口罩出了门，门口有很多人拍你，你不想多说什么，走了，订了第二天的机票，你先回了宿舍..</p>
            `,
            choices: [
                { text: "前往宿舍", action: () => nextStep(2) }
            ]
        },
        {
            id: 2,
            location: "宿舍",
            task: "任务3：调查屋子（睡衣、电脑、巧克力）",
            text: `
                <p>你回到宿舍，空无一人，你走上楼，看着标记着自己房间的门口走了进去，里面有很多顶帽子，还有你的玉桂狗睡衣，感觉自己很喜欢玉桂狗，蛮多玉桂狗的东西。</p>

        if (!view) {

        contentEl.scrollTop = contentEl.scrollHeight; // 滚动到底部

        // 添加线索
        if (!state.clues.includes(clueTitle)) {
            state.clues.push(clueTitle);
            updateClueList();
        }

        // 重新渲染选项，以更新条件解锁状态
        const currentStepData = script[state.currentStep];
        choicesEl.innerHTML = '';
        currentStepData.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            if (choice.condition && !choice.condition()) {
                btn.classList.add('locked');
            }
            btn.onclick = () => {
                if (choice.condition && !choice.condition()) return;
                choice.action();
            };
            choicesEl.appendChild(btn);
        });
    }

    // ===== 音频 / 视频绑定 =====
    function toggleRecordAudio() {
        const audio = document.getElementById('record-audio');
        if (!audio) return;
        if (audio.paused) {
            bgm.pause(); // 暂停 BGM，避免重叠
            audio.play().catch(() => {});
        } else {
            audio.pause();
        }
    }

    function bindMedia() {
        const audio = document.getElementById('record-audio');
        if (audio && !audio.dataset.bound) {
            audio.dataset.bound = '1';
            const icon = document.getElementById('audio-icon');
            const hint = document.getElementById('audio-hint');
            audio.addEventListener('play', () => { if (icon) icon.innerText = '⏸'; if (hint) hint.innerText = '播放中 · 点按暂停'; });
            audio.addEventListener('pause', () => { if (icon) icon.innerText = '▶'; if (hint) hint.innerText = '已暂停 · 点按播放'; });
            audio.addEventListener('ended', () => { if (icon) icon.innerText = '▶'; if (hint) hint.innerText = '2.57 MB · 点按播放'; bgm.play().catch(()=>{}); });
            audio.addEventListener('error', () => { if (hint) hint.innerText = '未找到录音文件，把 哥们不吃甜食.mp3 放到本 html 同一文件夹即可播放'; });
        }
        const video = document.getElementById('mom-video');
        if (video && !video.dataset.bound) {
            video.dataset.bound = '1';
            const tip = document.getElementById('video-tip');
            video.addEventListener('error', () => { if (tip) tip.style.display = 'block'; });
            video.addEventListener('play', () => { bgm.pause(); }); // 播放视频时暂停 BGM
        }
    }

    function initPhoneMock() {
        const screen = document.querySelector('.phone-screen');
        if (!screen || screen.dataset.inited) return;
        screen.dataset.inited = '1';

        // 主屏图标点击进入各 App
        screen.querySelectorAll('.pm-app').forEach(app => {
            app.onclick = () => {
                const type = app.dataset.app;
                if (type === 'wechat') showPage(buildWechatList(screen));
                if (type === 'sms') showPage(buildSmsList(screen));
                if (type === 'call') showPage(buildCallList(screen));
            };
        });
    }

    function showPage(page) {
        void page.offsetWidth;
        page.classList.add('show');
    }

    function makePage(screen, id, headerHTML, bodyHTML) {
        let page = screen.querySelector('#' + id);
        if (!page) {
            page = document.createElement('div');
            page.className = 'pm-page pm-sub-page';
            page.id = id;
            page.innerHTML = `<div class="pm-app-header">${headerHTML}</div>${bodyHTML}`;
            screen.appendChild(page);
            page.querySelector('.pm-back').onclick = () => page.classList.remove('show');
        }
        return page;
    }

    // ----- 微信对话列表 -----
    function buildWechatList(screen) {
        const page = makePage(screen, 'pm-wechat-list',
            '<span class="pm-back">‹</span><span>微信</span>',
            `<div class="pm-sys-note">复制粘贴和老蔫的近况 · 它们是猫猫</div><div class="pm-chat-list"></div>`);

        const list = page.querySelector('.pm-chat-list');
        if (!list.dataset.inited) {
            list.dataset.inited = '1';
            chats.forEach((c, i) => {
                const last = c.msgs[c.msgs.length - 1];
                const row = document.createElement('div');
                row.className = 'pm-row';
                row.innerHTML = `
                    <div class="pm-avatar" style="background:${c.color}">${c.avatar}</div>
                    <div class="pm-row-text">
                        <div class="pm-name">${c.name}</div>
                        <div class="pm-preview">${last[0] === 'r' ? '我: ' : ''}${last[1]}</div>
                    </div>`;
                row.onclick = () => openChat(i, screen);
                list.appendChild(row);
            });
        }
        return page;
    }

    // ----- 短信列表 -----
    function buildSmsList(screen) {
        const page = makePage(screen, 'pm-sms-list',
            '<span class="pm-back">‹</span><span>短信</span>',
            `<div class="pm-chat-list"></div>`);

        const list = page.querySelector('.pm-chat-list');
        if (!list.dataset.inited) {
            list.dataset.inited = '1';
            smsList.forEach((s, i) => {
                const row = document.createElement('div');
                row.className = 'pm-row';
                row.innerHTML = `

                    <div class="pm-row-text">
                        <div class="pm-name">${s.num}</div>
                        <div class="pm-preview">${s.text}</div>
                    </div>`;
                row.onclick = () => openSms(i, screen);
                list.appendChild(row);
            });
        }
        return page;
    }

    function openSms(idx, screen) {
        const s = smsList[idx];
        const page = makePage(screen, 'pm-sms-detail-' + idx,
            `<span class="pm-back">‹</span><span>${s.num}</span>`,
            `<div class="pm-bubbles">
                <div class="pm-b l">${s.text}</div>
            </div>`);
        showPage(page);
    }

    // ----- 通话记录 -----
    function buildCallList(screen) {
        const page = makePage(screen, 'pm-call-list',
            '<span class="pm-back">‹</span><span>通话记录</span>',
            `<div class="pm-chat-list"></div>`);

        const list = page.querySelector('.pm-chat-list');
        if (!list.dataset.inited) {
            list.dataset.inited = '1';
            callList.forEach(c => {
                const row = document.createElement('div');
                row.className = 'pm-row';

                    </div>`;

            });

    function openChat(idx, screen) {
        screen = screen || document.querySelector('.phone-screen');
        let page = screen.querySelector('#pm-chat-' + idx);
        const c = chats[idx];

        if (!page) {
            page = document.createElement('div');
            page.className = 'pm-page pm-sub-page';
            page.id = 'pm-chat-' + idx;
            page.innerHTML = `
                <div class="pm-app-header"><span class="pm-back">‹</span><span>${c.name}</span></div>
                <div class="pm-bubbles">
                    ${c.msgs.map(m => `<div class="pm-b ${m[0]}">${m[1]}</div>`).join('')}
                </div>`;
            screen.appendChild(page);
            page.querySelector('.pm-back').onclick = () => page.classList.remove('show');
        }

        showPage(page);
        const bubbles = page.querySelector('.pm-bubbles');
        if (bubbles) bubbles.scrollTop = bubbles.scrollHeight;
    }

    // --- 线索栏逻辑 ---
    function toggleClues() {
        clueModal.classList.toggle('active');
    }

    function updateClueList() {
        clueListEl.innerHTML = '';
        if (state.clues.length === 0) {
            clueListEl.innerHTML = '<p style="color: #888; text-align: center;">暂无收集到的线索</p>';
            return;
        }
        state.clues.forEach((clue, index) => {
            const div = document.createElement('div');
            div.className = 'clue-item';
            div.innerText = `${index + 1}. ${clue}`;
            clueListEl.appendChild(div);
        });
    }

    // 点击弹窗外部关闭
    clueModal.addEventListener('click', (e) => {
        if (e.target === clueModal) {
            toggleClues();
        }
    });

    // 启动游戏
    init();
